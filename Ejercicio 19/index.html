<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 19</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Registro (2 pasos)</h1>

  <form action="#" method="post">
    
    <section id="paso1" class="paso">
      <h2>Paso 1: Datos personales</h2>
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required minlength="2">
      </div>
      <div class="campo">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <a href="#paso2" class="btn-siguiente">Siguiente →</a>
    </section>

    
    <section id="paso2" class="paso">
      <h2>Paso 2: Cuenta</h2>
      <div class="campo">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" required pattern="[A-Za-z0-9_]{4,}">
      </div>
      <div class="campo">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <a href="#paso1" class="btn-atras">← Atrás</a>
      <button type="submit">Registrarme</button>
    </section>
  </form>
</body>
</html>
